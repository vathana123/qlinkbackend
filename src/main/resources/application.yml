spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: qlinkbackend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qlink_db}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
qlink:
  jwt:
    issuer: ${JWT_ISSUER:qlink-api}
    public-key: ${JWT_PUBLIC_KEY:file:./secrets/public.pem}
    private-key: ${JWT_PRIVATE_KEY:file:./secrets/private.pem}
    access-ttl: 15m
    refresh-ttl: 30d
  oauth:
    google-client-ids: ${GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_IDS:}}
    google-android-client-ids: ${GOOGLE_ANDROID_CLIENT_IDS:}
    apple-client-ids: ${APPLE_CLIENT_IDS:}
  push:
    enabled: ${PUSH_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://10.0.2.2:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app:
  storage:
    root-path: ${STORAGE_ROOT:./storage/dev}
    max-file-size: ${STORAGE_MAX_FILE_SIZE:25MB}
